name: Idea or feature request
description: Something Windcraft could do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem first, then the idea. Examples from your own pages help.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you thought of
